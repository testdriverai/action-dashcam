name: Pull Request - Validation

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches-ignore:
      - '**/graphite-base/**'
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Install Dashcam
        uses: ./.
        with:
          version: "1.0.49"
          cli-version: "1.4.13-beta.3"
          node-version: "22.19.0"
          node-directory: "C:\\nodejs22"
          node-prefix: "C:\\nodejs22\\npm-installs"

      - name: Start Dashcam
        uses: ./start
        continue-on-error: true
        with:
          api-key: ${{ secrets.TD_API_KEY }}
          project-id: "507f1f77bcf86cd799439011"
          title: "${{ github.workflow }} ${{ github.run_number }}-${{ github.run_attempt }} - ${{ runner.name }}"

      - name: Stop Dashcam
        uses: ./stop
        continue-on-error: true
  validate_macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Install Dashcam - MacOS
        uses: ./.
        with:
          version: "1.0.49"
          cli-version: "1.4.13-beta.3"
          node-version: "22.19.0"
          node-directory: "${{ runner.temp }}/nodejs22"
          node-prefix: "${{ runner.temp }}/nodejs22/npm-installs"
  
